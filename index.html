<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bouncing-balls-simulation</title>
</head>

<body>
  <div id="app" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    <div style="display: flex; gap: 16px; align-items: center; flex-direction: row;">
      <div>
        <canvas id="myCanvas" width="1500" height="800"></canvas>
      </div>
      <div id="controls">
        <h3>Simulation Controls</h3>

        <div class="control-group">
          <label for="gravityInput">Gravity</label>
          <input id="gravityInput" type="number" step="0.1" value="9.8">
        </div>

        <div class="control-group">
          <label for="speedInput">Speed</label>
          <input id="speedInput" type="number" step="0.1" value="1">
        </div>

        <div class="control-group">
          <label for="radiusInput">Radius</label>
          <input id="radiusInput" type="number" step="1" value="5">
        </div>

        <div class="control-group">
          <label for="bouncinessInput">Bounciness</label>
          <input id="bouncinessInput" type="range" min="0" max="1" step="0.01" value="0.9">
        </div>
        <div>
          <label for="motionBlurInput">DisableMotion Blur</label>
          <input id="motionBlurInput" style="scale: 2; margin-left: 10px;" type="checkbox" checked>
        </div>

        <div class="control-group">
          <label for="countInput">Count</label>
          <input id="countInput" type="number" value="1000">
        </div>
        <div class="control-group">
          <label for="defaultColorInput">Default Color</label>
          <input id="defaultColorInput" type="color" value="#0000ff">
        </div>

        <div class="control-group">
          <label for="collisionColorInput">Collision Color</label>
          <input id="collisionColorInput" type="color" value="#ff0000">
        </div>
        <button id="accelerateButton">
          Accelerate 2×
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
  <script type="module" src="/src/control.ts"></script>
</body>


</html>
